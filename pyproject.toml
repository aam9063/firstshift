[project]
name = "firstshift"
version = "0.1.0"
description = "From staffing gap to first productive shift: an AI agent deployment for a fast-food chain"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "celery>=5.4",
    "redis>=5.2",
    "structlog>=24.4",
    "strands-agents>=0.1",
    "openai>=1.60",
    "langfuse>=2.59",
    "twilio>=9.4",
    "prometheus-client>=0.21",
    "sentry-sdk[fastapi]>=2.19",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "respx>=0.22",
    "ruff>=0.9",
    "mypy>=1.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]

[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true
